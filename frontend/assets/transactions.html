<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions — Finance Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <a href="../../index.html" class="header-brand">
    <div class="brand-icon">💰</div>
    <h1>Finance Tracker</h1>
  </a>
  <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <nav>
    <a href="../../index.html">Dashboard</a>
    <a href="accounts.html">Comptes</a>
    <a href="categories.html">Catégories</a>
    <a href="transactions.html" class="active">Transactions</a>
    <a href="summary.html">Résumé</a>
  </nav>
</header>

<main class="container">
  <div style="max-width:600px;margin:0 auto;">
    <section class="card">
      <h3>Ajouter une transaction</h3>

      <div class="form-group">
        <label for="account_id">Compte associé</label>
        <select id="account_id"></select>
      </div>
      <div class="form-group">
        <label for="category_id">Catégorie</label>
        <select id="category_id">
          <option value="">— Sélectionnez une catégorie —</option>
        </select>
      </div>
      <div class="form-group">
        <label for="type">Type de transaction</label>
        <select id="type" onchange="toggleCategoryRequired()">
          <option value="expense" selected>📤 Dépense</option>
          <option value="income">📥 Revenu</option>
        </select>
      </div>
      <div class="form-group">
        <label for="amount">Montant (Ar)</label>
        <input id="amount" type="number" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label for="note">Note / Description</label>
        <input id="note" placeholder="ex: Courses Leclerc, Virement salaire…">
      </div>
      <div class="form-group">
        <label for="date">Date de transaction</label>
        <input id="date" type="date">
      </div>

      <button onclick="createTransaction()">Ajouter la transaction</button>
    </section>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
