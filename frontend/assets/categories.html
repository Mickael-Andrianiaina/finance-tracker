<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catégories — Finance Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <a href="../../index.html" class="header-brand">
    <div class="brand-icon">💰</div>
    <h1>Finance Tracker</h1>
  </a>
  <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <nav>
    <a href="../../index.html">Dashboard</a>
    <a href="accounts.html">Comptes</a>
    <a href="categories.html" class="active">Catégories</a>
    <a href="transactions.html">Transactions</a>
    <a href="summary.html">Résumé</a>
  </nav>
</header>

<main class="container">
  <div class="grid-layout">

    <section class="card">
      <h3>Créer une catégorie</h3>
      <div class="form-group">
        <label for="name">Nom de la catégorie</label>
        <input id="name" placeholder="ex: Nourriture, Loisirs…">
      </div>
      <div class="form-group">
        <label for="limit">
          Limite mensuelle (Ar)
          <span style="color:var(--text-muted);font-size:0.75rem;text-transform:none;letter-spacing:0;font-weight:400;">(optionnel)</span>
        </label>
        <input id="limit" type="number" step="0.01" placeholder="Aucune limite">
      </div>
      <button onclick="createCategory()">Créer la catégorie</button>
    </section>

    <section class="card">
      <h3>Catégories existantes</h3>
      <div id="categoriesList" class="item-list">
        <div class="skeleton" style="height:64px;border-radius:10px;"></div>
        <div class="skeleton" style="height:64px;border-radius:10px;margin-top:.75rem;"></div>
      </div>
    </section>

  </div>
</main>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
